[project]
name = "old-deps-test"
version = "0.1.0"
description = "Test project with deliberately outdated dependencies for upgrade-tool latency testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.5",
    "flask>=1.1.4",
    "django>=4.2.30",
    "numpy>=1.19.5",
    "pandas>=1.3.3",
    "click>=7.1.2",
    "jinja2>=2.11.3",
    "urllib3>=1.26.5",
    "pyyaml>=6.0.3",
    "six>=1.15.0",
    "certifi>=2020.12.5",
    "idna>=2.10",
    "pytz>=2021.1",
    "python-dateutil>=2.8.1",
    "attrs>=20.3.0",
    "packaging>=26.3",
    "cryptography>=47.0.0",
    "sqlalchemy>=2.0.52",
    "pydantic>=1.7.3",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "aiohttp>=3.13.5",
    "boto3>=1.42.97",
    "redis>=7.0.1",
    "pillow>=11.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "http://localhost:8081/repository/pypi-group/simple"
default = true
