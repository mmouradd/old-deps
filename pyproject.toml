[project]
name = "old-deps-test"
version = "0.1.0"
description = "Test project with deliberately outdated dependencies for upgrade-tool latency testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.5",
    "flask>=1.1.4",
    "django>=4.2.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "http://localhost:8081/repository/pypi-group/simple"
default = true
