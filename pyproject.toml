[project]
name = "old-deps-test"
version = "0.1.0"
description = "Test project with deliberately outdated dependencies for upgrade-tool latency testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests==2.25.1",
    "flask==1.1.4",
    "django==3.1.13",
    "numpy==1.19.5",
    "pandas==1.1.5",
    "click==7.1.2",
    "jinja2==2.11.3",
    "urllib3==1.26.5",
    "pyyaml==5.4.1",
    "six==1.15.0",
    "certifi==2020.12.5",
    "idna==2.10",
    "pytz==2021.1",
    "python-dateutil==2.8.1",
    "attrs==20.3.0",
    "packaging==20.9",
    "cryptography==3.3.2",
    "sqlalchemy==1.3.23",
    "pydantic==1.7.3",
    "fastapi==0.63.0",
    "uvicorn==0.13.4",
    "aiohttp==3.7.4",
    "boto3==1.16.63",
    "redis==3.5.3",
    "pillow==8.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
